[project]
name = "agent-state-driver"
version = "0.1.0"
description = "Reliable state detection and programmatic driving of interactive CLI AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yorai Levi" }]
keywords = ["claude-code", "agent", "tmux", "pty", "orchestration", "state-detection"]

# The drivers themselves are deliberately stdlib-only: a detector you can drop onto
# a strange machine with nothing but python3 and tmux is worth more than one that
# needs a wheel. Dependencies below are for TESTING only.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/YoraiLevi/agent-state-driver"
Issues = "https://github.com/YoraiLevi/agent-state-driver/issues"

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
  "slow: drives a live mock session through tmux (seconds, no credentials, no API cost)",
  "real_cli: spends real API turns against the installed claude CLI — opt in with -m real_cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prototypes"]
